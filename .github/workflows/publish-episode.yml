name: publish-episode

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle id, such as 2026-10-30-smoke, or the Parts' Bundle ids with spaces"
        required: true
      dry_run:
        description: "Only encode, and keep the .m4a as a workflow artifact"
        type: boolean
        default: true
      voice:
        description: "Dry run only: a roster voice to read the Bundle in instead of its own"
        required: false
        default: ""

# A real publish makes a Release, commits the Episode registry and dispatches deploy-site.
permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ inputs.bundle }}
      DRY_RUN: ${{ inputs.dry_run }}
      VOICE: ${{ inputs.voice }}
      KOKORO_MODELS: ${{ github.workspace }}/models
      # Its own folder, so its cache never overlaps the Kokoro or Pocket ones.
      WHISPER_MODELS: ${{ github.workspace }}/whisper
      # Network steps retry at most twice; pip's own default is five.
      PIP_RETRIES: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Find the Bundle
        id: bundle
        run: |
          # An Episode is published in the voice its Bundle names, so another voice is only
          # for hearing a Bundle in it.
          if [ -n "$VOICE" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::The voice input is for dry runs only"
            exit 1
          fi
          # Parts come as several ids, and publish together or not at all.
          found=()
          for id in $BUNDLE_ID; do
            if [[ ! "$id" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::Not a Bundle id: $id"
              exit 1
            fi
            # The smoke Bundle is a test fixture, so it is not under bundles/. It may only
            # dry-run: a real publish would spend an Episode number on it for good.
            dirs=("bundles/$id")
            if [ "$DRY_RUN" = "true" ]; then dirs+=("tests/fixtures/bundles/$id"); fi
            for dir in "${dirs[@]}" ""; do
              if [ -z "$dir" ]; then
                echo "::error::No Bundle folder for $id"
                exit 1
              fi
              if [ -d "$dir" ]; then found+=("$dir"); break; fi
            done
          done
          if [ ${#found[@]} = 0 ]; then
            echo "::error::No Bundle id given"
            exit 1
          fi
          echo "dirs=${found[*]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: >-
          command -v ffmpeg || (sudo apt-get -o Acquire::Retries=2 update
          && sudo apt-get -o Acquire::Retries=2 install -y ffmpeg)
      # Only the engine the voice needs: Pocket brings PyTorch, which a Kokoro run never wants.
      - run: pip install -e ".[asr]"
      - name: Restore the ASR model
        uses: actions/cache@v6
        with:
          path: whisper
          key: faster-whisper-base.en
      - name: Find the engines
        id: engines
        run: |
          engines=""
          for dir in $DIRS; do
            engine=$(pipeline render "$dir" --engine ${VOICE:+--voice "$VOICE"})
            echo "$dir: voice ${VOICE:-from the Bundle} uses $engine"
            engines="$engines $engine"
          done
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
        env:
          DIRS: ${{ steps.bundle.outputs.dirs }}
      - if: contains(steps.engines.outputs.engines, 'kokoro')
        run: |
          pip install -e ".[kokoro]"
          if pip show torch > /dev/null 2>&1; then
            echo "::error::PyTorch got installed for a Kokoro run"
            exit 1
          fi
      - if: contains(steps.engines.outputs.engines, 'pocket')
        run: pip install -e ".[pocket]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Restore the Pocket model and voices
        if: contains(steps.engines.outputs.engines, 'pocket')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pocket_tts
          key: pocket-tts-4.0.1
      - name: Restore the Kokoro model
        if: contains(steps.engines.outputs.engines, 'kokoro')
        id: models
        uses: actions/cache@v6
        with:
          path: models
          key: kokoro-v1.0-int8
      - name: Download the Kokoro model
        if: contains(steps.engines.outputs.engines, 'kokoro') && steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for file in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            curl -fsSL --retry 2 --retry-delay 5 -o "models/$file" "$base/$file"
          done
          sha256sum -c <<'SUMS'
          6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb  models/kokoro-v1.0.int8.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  models/voices-v1.0.bin
          SUMS
      - name: Lint
        run: for dir in $DIRS; do pipeline lint "$dir"; done
        env:
          DIRS: ${{ steps.bundle.outputs.dirs }}
      - name: Render
        run: |
          for dir in $DIRS; do
            pipeline render "$dir" --out "out/$(basename "$dir").wav" ${VOICE:+--voice "$VOICE"}
          done
        env:
          DIRS: ${{ steps.bundle.outputs.dirs }}
      - name: Publish
        run: |
          wavs=()
          for dir in $DIRS; do wavs+=("out/$(basename "$dir").wav"); done
          pipeline publish $DIRS --wav "${wavs[@]}" --out-dir artifact $DRY_RUN_FLAG
        env:
          DIRS: ${{ steps.bundle.outputs.dirs }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.bundle }}${{ inputs.voice && format('-{0}', inputs.voice) || '' }}
          path: artifact/
          if-no-files-found: error
      # The deploy queues behind this run, since both share the publish concurrency group.
      # Unlike a Release, a second deploy from a retry that had already landed does no harm.
      - name: Dispatch deploy-site
        if: ${{ !inputs.dry_run }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run deploy-site.yml --ref "$GITHUB_REF_NAME" -f bundle="$BUNDLE_ID" && exit 0
            [ "$attempt" = 3 ] || sleep 5
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    needs: publish
    # A job cut off by its timeout ends cancelled, which failure() alone would miss.
    if: failure() || cancelled()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      bundle: ${{ inputs.bundle }}
