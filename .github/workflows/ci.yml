name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      # The Kokoro extra brings espeak, which the Lexicon tests phonemize with.
      - run: pip install -e ".[dev,kokoro]"
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: pytest
