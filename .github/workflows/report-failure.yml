name: report-failure

# publish-episode and deploy-site call this when one of their jobs fails, so the owner hears
# about it in one issue. Success calls nothing.
on:
  workflow_call:
    inputs:
      bundle:
        type: string
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      PIP_RETRIES: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # The failed job has finished by now, so its log can be read.
      - run: pipeline report --bundle "$BUNDLE" --assignee "$OWNER"
        env:
          BUNDLE: ${{ inputs.bundle }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
