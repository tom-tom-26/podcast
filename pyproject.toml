[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Turns Plainly Put Bundles into published Episodes and an updated Feed."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# One extra per TTS engine, so a workflow installs only the engine its voice needs.
kokoro = ["kokoro-onnx==0.6.1"]
# Pulls in PyTorch; install it from the CPU wheel index, or pip fetches the CUDA build.
pocket = ["pocket-tts==4.0.1", "audiotsm==0.1.2"]
# The ASR gate's speech recogniser; the tests fake it, so only publish-episode installs it.
asr = ["faster-whisper==1.2.1"]
# Only for redrawing the cover; the Pipeline reads the committed PNG.
artwork = ["pillow>=11", "resvg-py==0.5.0"]
dev = [
    "import-linter>=2.1",
    "pillow>=11",
    "pre-commit>=4",
    "pytest>=8",
    "ruff==0.17.3"  # keep in step with .pre-commit-config.yaml,
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
# Every top-level package in the repo goes here and in source_modules below.
root_packages = ["pipeline", "tests"]

[[tool.importlinter.contracts]]
name = "Only the pipeline package imports its private library"
type = "forbidden"
source_modules = ["tests"]
forbidden_modules = ["pipeline._lib"]
# Tests reach _lib through the entry points; only direct imports are forbidden.
allow_indirect_imports = true
