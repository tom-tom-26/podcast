  # P3 constructions
  - (serves|stands|acts) as (a|an|the)
  - plays an? (crucial|key|pivotal|vital|significant|important) role
  - a (testament|reminder) (to|of)
  - it'?s (important|worth) (to note|noting|mentioning|remembering)
  - not (just|only|merely) [^.]{1,60}but( also)?
  - it'?s not [^.]{1,50}[,.] it'?s
  - ', (highlighting|underscoring|emphasi[sz]ing|showcasing|reflecting|ensuring|fostering|illustrating)'
  - the (truth|reality) is
  - at the end of the day
  - let that sink in
  - make no mistake
  - the bottom line is
  - here'?s the (kicker|catch)
  - when it comes to
  - despite (these|the) challenges
  - the future (looks|is) bright
  - only time will tell
  - (studies|research|experts|scientists) (show|shows|say|suggest|agree|confirm)
  - some (people|experts|critics|researchers) (say|argue|believe|claim)
  - (good|excellent|fantastic) question
  - fascinating|amazing|incredible|mind-blowing
  - (ultimately,? )?it (all )?depends
  - pros and cons
  - when i (first )?(tried|started|did)
  - i remember (when|the first)
  - my (clients|listeners|patients|friends)
  # P4 meta-talk
  - in this (section|segment|part|episode),? (we|i)('ll| will)
  - as (we|i) (mentioned|discussed|said|saw) (earlier|before|above)
  - now,? let'?s (turn|move|look|talk|shift)
  - let'?s (take a (closer )?look|explore|unpack|break (it|this) down)
  - first and foremost

# P5, show notes only.
show_notes:
  - key takeaways?
