# The de-slop phrase list (research/18 section 9.2, research/05 12.11). Each entry is a
# case-insensitive regex matched as whole words in the Script, title, summary and show notes.
# Feedback mode may add phrases; a Bundle records the version it was written against.
version: 1

# F9, firm: the core ten block a run.
block:
  - let'?s dive in
  - dive deep
  - delv(e|es|ed|ing)
  - in today'?s episode
  - welcome back
  - without further ado
  - buckle up
  - great question
  - it'?s important to note
  - it'?s worth noting

# Everything else only warns; the Skill fixes it or keeps it with a reason in lint_report.yaml.
warn:
  # P1 openers, closers and fake engagement
  - dive into
  - in conclusion
  - to sum up
  - in summary
  - in short,
  - that'?s a wrap
  - until next time
  - stay tuned
  - thanks for (listening|tuning in)
  - subscribe
  - leave a review
  - rate (us|the show)
  - let (us|me) know in the comments
  - see you next (week|time)
  - link in the (description|show notes)
  # P2 vocabulary
  - tapestry
  - intricac(y|ies)
  - intricate
  - underscor(e|es|ed|ing)
  - pivotal
  - crucial
  - paramount
  - realm
  - landscape
  - testament
  - showcas(e|es|ed|ing)
  - foster(s|ed|ing)?
  - leverag(e|es|ed|ing)
  - navigat(e|es|ing)
  - robust
  - seamless(ly)?
  - multifaceted
  - nuanced
  - vibrant
  - embark
  - unlock
  - unleash
  - supercharge
  - game[- ]?changer
  - groundbreaking
  - revolutioni[sz]e
  - meticulous(ly)?
  - palpable
  - camaraderie
  - interplay
