# The voice roster. See GLOSSARY.md for the words used here.
#
# speed: a Kokoro voice's base speed. stretch: a Pocket voice's WSOLA time-stretch; a Pocket
# voice without one is read at its own pace. The pacing config's jitter goes on top of either.
# seed: Pocket only, since Kokoro is deterministic. credit: CC BY voices only.
# suits: filled in from the owner's reactions to real Episodes.
default: bm_george

# Soft: render warns. A voice that needs a slower stretch is out of the roster.
stretch_floor: 0.85

voices:
  bm_george:
    engine: kokoro
    # Base speed for about 165 wpm with long chunks.
    speed: 1.07
    suits: [anything]
  bm_lewis:
    engine: kokoro
    speed: 1.12
    suits: []
  charles:
    engine: pocket
    stretch: 0.905
    seed: 0
    suits: []
    credit: >-
      Voice: charles (VCTK corpus, CSTR, University of Edinburgh), Kyutai Pocket TTS voices,
      CC BY 4.0 (https://huggingface.co/kyutai/tts-voices)
  alba:
    engine: pocket
    stretch: 0.907
    seed: 0
    suits: []
    credit: >-
      Voice: alba (Alba MacKenna), Kyutai Pocket TTS voices, CC BY 4.0
      (https://huggingface.co/kyutai/tts-voices)
  # CC0, so no credit.
  stuart_bell:
    engine: pocket
    seed: 0
    suits: []
