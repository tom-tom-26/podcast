  - {term: IVF, kokoro: /ˈaɪvˈiːˈɛf/, by: review 2026-10-29, note: espeak reads it as one syllable}
  - {term: ETF, kokoro: /ˈiːtˈiːˈɛf/, by: review 2026-10-29}
  - {term: IMF, kokoro: /ˈaɪˈɛmˈɛf/, by: review 2026-10-29}
  - {term: ECB, kokoro: /ˈiːsˈiːbˈiː/, by: review 2026-10-29}
  - {term: Q and A, kokoro: /kjˈuː ənd ˈeɪ/, by: review 2026-10-29, note: espeak turns a lone A into a schwa}
