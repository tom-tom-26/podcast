# The pronunciation lexicon (research/14), applied per chunk before synthesis.
#
# entries: how to say a word or phrase an engine gets wrong.
#   term    as written in the Script; whole word, case-sensitive; may be a phrase
#   kokoro  /phonemes/ in espeak-ng en-gb with stress marks, or a lower-case respelling
#           that espeak reads (no capitals: they read as letters)
#   pocket  text Pocket TTS reads instead: hyphenated chunks of real syllables (W-H-O,
#           Zeit-gayber), never run-together respellings, which it garbles. Omit it to
#           leave the term as written: Pocket's own front end reads most terms right
#   by      who added it and when: skill, owner, review
#   note    the human version ("owner: KOH-koh-roh") and why
#
# verified: all-capital words that every roster voice reads correctly as written.
# Any other capitals word needs an entry; digits are allowed only inside an entry's term.

verified: [HRV, BDNF, LDL, DNA, UK, NHS, BBC, GDP, ADHD, PTSD, MRI, HIV, CEO, EU, NASA, NATO, UNESCO, FIFA, ATP]

entries:
  - {term: WHO, kokoro: /dˈʌbəljuː ˈeɪtʃ ˈəʊ/, pocket: W-H-O, by: review 2026-10-29, note: espeak says "who"}
  - {term: REM, kokoro: rem, by: review 2026-10-29, note: said as a word}
  - {term: SSRIs, kokoro: /ˈɛsˈɛsˈɑːɹaɪz/, pocket: "S-S-R-I's", by: review 2026-10-29, note: "espeak says ess-sree"}
